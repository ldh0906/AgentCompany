# 리팩터링: 지금 동작을 테스트로 고정한 다음, 동작을 바꾸지 않고 구조만 바꾼다.
name: refactor
title: 리팩터링
description: 지금 동작을 고정하는 테스트 → 구조 개선(테스트는 그대로 통과)
steps:
  - key: pin
    title: 동작 고정
    type: impl
    guide: 바꿀 코드의 지금 동작을 그대로 확인하는 테스트를 추가한다. 코드는 바꾸지 않는다(지금 코드에서 통과해야 한다).
    requirements:
      - text: 바꿀 부분의 지금 동작을 확인하는 테스트가 추가되었고, 기존 코드에서 통과한다
        evidence: unit_test
  - key: reshape
    title: 구조 개선
    type: impl
    guide: 1단계 테스트를 고치지 않고 구조를 개선한다. 밖에서 보이는 동작·공개 이름은 그대로 둔다(바꿨다면 이유를 적는다).
    requirements:
      - text: 1단계에서 추가한 테스트를 고치지 않고 모두 통과한다
        evidence: unit_test
      - text: 밖에서 보이는 동작과 공개 이름이 그대로다(바꿨다면 이유가 보고에 있다)
        evidence: inspection
