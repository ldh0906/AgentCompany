# 버그 수정: 재현하는 테스트를 먼저 쓰고, 원인을 고치고, 다시 깨지지 않게 막는다.
name: bugfix
title: 버그 수정
description: 재현 테스트 → 원인 수정(회귀 방지)
steps:
  - key: fix
    title: 재현과 수정
    type: impl
    guide: 먼저 버그를 재현하는 테스트를 쓰고(고치기 전 코드에서는 실패해야 한다), 증상이 아니라 원인을 고쳐 통과시킨다. 원인을 보고의 summary에 한두 문장으로 적는다.
    requirements:
      - text: 버그를 재현하는 회귀 테스트가 있다(고치기 전 코드에서는 실패한다)
        evidence: unit_test
      - text: 증상이 아니라 원인을 고쳤고, 원인이 보고에 적혀 있다
        evidence: inspection
